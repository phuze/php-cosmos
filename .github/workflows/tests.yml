name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        guzzle: ['6', '7', '8']
        exclude:
          # guzzle 7 needs php 7.2.5 or later
          - php: '7.0'
            guzzle: '7'
          - php: '7.1'
            guzzle: '7'
          # guzzle 8 needs php 7.4 or later
          - php: '7.0'
            guzzle: '8'
          - php: '7.1'
            guzzle: '8'
          - php: '7.2'
            guzzle: '8'
          - php: '7.3'
            guzzle: '8'

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: |
          # guzzle 6 has open security advisories, so newer versions of composer
          # refuse to install it. the older composer used on php 7.0 and 7.1
          # doesn't block it, and doesn't have this setting, so hide that error.
          composer config audit.block-insecure false > /dev/null 2>&1 || true
          composer require "guzzlehttp/guzzle:^${{ matrix.guzzle }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: composer test

  # one check that only passes when every test job above passes, so branch
  # protection can require this instead of each php and guzzle combination
  all-tests-passed:
    name: All tests passed
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test.result }}" = "success"
